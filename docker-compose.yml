networks:
  openhim:

services:
  mongo-db:
    container_name: mongo-db
    image: mongo:4.0
    networks:
      - openhim
    volumes:
      - "mongo-data:/data/db"
    restart: unless-stopped

  openhim-core:
    container_name: openhim-core
    image: jembi/openhim-core:latest
    restart: unless-stopped
    environment:
      - mongo_url=mongodb://mongo-db/openhim-development
      - mongo_atnaUrl=mongodb://mongo-db/openhim-development
      - NODE_ENV=development
      - api_authenticationTypes=["token", "basic", "openid", "local"]
      - authentication_enableCustomTokenAuthentication=true
      - authentication_enableJWTAuthentication=true
      - authentication_jwt_secretOrPublicKey=secret
      - authentication_jwt_algorithms=HS256
      - authentication_jwt_issuer=openhim
      - openhimConsoleBaseUrl=http://localhost:${OPENHIM_CONSOLE_HOST_PORT:-9000}
    # Bound to loopback, not 0.0.0.0: this stack's only legitimate callers of
    # the router (5000/5001) are the mediator/openhim-setup containers, already
    # reachable via the shared `openhim` Docker network -- these host-published
    # copies exist only for local host-side debugging (curl/console access),
    # not for any real external caller. If push mode is ever used with OpenMRS
    # on a different host, the HTTPS port (default 5000, see
    # OPENHIM_ROUTER_HTTPS_HOST_PORT below) should be the one re-published on
    # a real interface, scoped/firewalled to that host, so the inbound
    # channel's Basic Auth / X-Mediator-Secret credentials aren't sent in
    # cleartext across that network -- not the HTTP port (default 5001). Keep
    # the HTTP port loopback-only even then.
    # Host-side port numbers are all overridable via .env (defaults shown) --
    # this stack may run alongside other dockerized apps on a shared host, so
    # any of these may need to move to avoid a collision. Only the host side
    # changes; the container-internal ports (8080/5000/5001) stay fixed.
    ports:
      - "127.0.0.1:${OPENHIM_ADMIN_API_HOST_PORT:-8081}:8080"
      - "127.0.0.1:${OPENHIM_ROUTER_HTTPS_HOST_PORT:-5000}:5000"
      - "127.0.0.1:${OPENHIM_ROUTER_HTTP_HOST_PORT:-5001}:5001"
    networks:
      - openhim
    healthcheck:
      # The reference healthcheck this is modeled on used curl, which this
      # image doesn't have (confirmed via `docker exec ... which curl` ->
      # not found, so that healthcheck always reported unhealthy). wget is
      # present instead.
      test: "wget --no-check-certificate -qO- https://openhim-core:8080/heartbeat || exit 1"
      interval: 30s
      timeout: 30s
      retries: 3

  openhim-console:
    container_name: openhim-console
    image: jembi/openhim-console:latest
    restart: unless-stopped
    environment:
      # Tells the console UI (running in the operator's browser, not this
      # container) which host port to reach the admin API on -- must track
      # whatever OPENHIM_ADMIN_API_HOST_PORT actually publishes, not the
      # container-internal 8080 a browser can't reach directly.
      - OPENHIM_MEDIATOR_API_PORT=${OPENHIM_ADMIN_API_HOST_PORT:-8081}
    networks:
      - openhim
    ports:
      - "127.0.0.1:${OPENHIM_CONSOLE_HOST_PORT:-9000}:80"
    healthcheck:
      test: "wget -qO- http://openhim-console || exit 1"
      interval: 30s
      timeout: 30s
      retries: 3

  openmrs-advapacs-mediator:
    container_name: openmrs-advapacs-mediator
    build: .
    restart: unless-stopped
    depends_on:
      - openhim-core
    networks:
      - openhim
    extra_hosts:
      # Lets this container reach OpenMRS running on the host machine.
      - "host.docker.internal:host-gateway"
    environment:
      # Topology: hardcoded to the compose network, not read from .env.
      - OPENHIM_API_URL=https://openhim-core:8080
      - OPENHIM_TRUST_SELF_SIGNED=true
      - OPENHIM_ROUTER_URL=http://openhim-core:5001
      - ADVAPACS_CHANNEL_URL=http://openhim-core:5001/advapacs
      - MEDIATOR_PORT=3500
      - MEDIATOR_STANDALONE=false
      # Secrets/config: sourced from this repo's own .env (gitignored) via
      # compose's automatic ${VAR} substitution.
      - OPENHIM_USERNAME=${OPENHIM_USERNAME}
      - OPENHIM_PASSWORD=${OPENHIM_PASSWORD}
      - OPENHIM_INBOUND_CLIENT_ID=${OPENHIM_INBOUND_CLIENT_ID}
      - OPENHIM_INBOUND_CLIENT_PASSWORD=${OPENHIM_INBOUND_CLIENT_PASSWORD}
      - MEDIATOR_INBOUND_SECRET=${MEDIATOR_INBOUND_SECRET}
      - LOG_LEVEL=${LOG_LEVEL}
      - ORDER_INGESTION_MODE=${ORDER_INGESTION_MODE}
      - ORDER_POLL_INTERVAL_MS=${ORDER_POLL_INTERVAL_MS}
      # OPENMRS_BASE_URL is read from .env, not hardcoded here -- unlike the
      # topology vars above, it varies by where OpenMRS actually runs. If
      # OpenMRS is on this same host, .env needs host.docker.internal (not
      # localhost, which inside this container means the container itself).
      - OPENMRS_BASE_URL=${OPENMRS_BASE_URL}
      - OPENMRS_FHIR_PATH=${OPENMRS_FHIR_PATH}
      - OPENMRS_USERNAME=${OPENMRS_USERNAME}
      - OPENMRS_PASSWORD=${OPENMRS_PASSWORD}
      - PATIENT_IDENTIFIER_SYSTEM=${PATIENT_IDENTIFIER_SYSTEM}
      - ADVAPACS_BASE_URL=${ADVAPACS_BASE_URL}
      - ADVAPACS_CLIENT_ID=${ADVAPACS_CLIENT_ID}
      - ADVAPACS_CLIENT_SECRET=${ADVAPACS_CLIENT_SECRET}
      - ADVAPACS_WEBHOOK_SECRET=${ADVAPACS_WEBHOOK_SECRET}

  openhim-setup:
    build: .
    command: ["node", "scripts/setupOpenhim.js"]
    restart: "no"
    depends_on:
      - openhim-core
    networks:
      - openhim
    environment:
      - OPENHIM_API_URL=https://openhim-core:8080
      - OPENHIM_TRUST_SELF_SIGNED=true
      - OPENHIM_USERNAME=${OPENHIM_USERNAME}
      - OPENHIM_PASSWORD=${OPENHIM_PASSWORD}
      - OPENHIM_INBOUND_CLIENT_ID=${OPENHIM_INBOUND_CLIENT_ID}
      - OPENHIM_INBOUND_CLIENT_PASSWORD=${OPENHIM_INBOUND_CLIENT_PASSWORD}
      - ADVAPACS_BASE_URL=${ADVAPACS_BASE_URL}

volumes:
  mongo-data:
